<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Lab</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --panel: #12121a;
            --border: #2a2a3a;
            --green: #00ff88;
            --text: #e0e0e0;
            --muted: #666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'SF Mono', 'Courier New', monospace;
            min-height: 100vh;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 16px; }

        .header {
            text-align: center;
            padding: 24px 0 16px;
        }

        .header h1 {
            font-size: 22px;
            letter-spacing: 4px;
            color: var(--green);
        }

        .header .subtitle {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .panel h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .label { font-size: 13px; color: #aaa; }
        .value { font-size: 16px; font-weight: bold; color: var(--green); }

        .bar {
            height: 4px;
            background: #1a1a2a;
            border-radius: 2px;
            margin: 4px 0 10px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.15s ease;
        }

        canvas {
            width: 100%;
            height: 150px;
            background: #0a0a12;
            border-radius: 12px;
            margin-top: 8px;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .dot.off { background: #ff4444; box-shadow: 0 0 8px #ff4444; }

        .buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        button {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--green);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 1px;
        }

        button:hover { border-color: var(--green); }
        button.primary { background: var(--green); color: var(--bg); border: none; }

        #logPreview {
            background: #08080f;
            border: 1px solid #1a1a2a;
            border-radius: 8px;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 10px;
            color: #555;
            margin: 8px 0;
            font-family: monospace;
        }

        .format-toggle {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .format-btn {
            padding: 6px 14px;
            font-size: 11px;
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 6px;
            cursor: pointer;
        }

        .format-btn.active {
            background: #1a2a1a;
            border-color: var(--green);
            color: var(--green);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SENSOR LAB</h1>
            <div class="subtitle">Инструмент для Ghost Lock</div>
        </div>

        <!-- Статус -->
        <div class="panel">
            <h3>📡 Подключение</h3>
            <div class="status-row">
                <div class="dot" id="orientDot"></div>
                <span style="font-size:13px;">Ориентация</span>
            </div>
            <div class="status-row">
                <div class="dot" id="motionDot"></div>
                <span style="font-size:13px;">Акселерометр</span>
            </div>
            <div class="status-row">
                <div class="dot" id="lightDot"></div>
                <span style="font-size:13px;">Освещённость: <span id="lightVal">-- lx</span></span>
            </div>
        </div>

        <!-- Ориентация -->
        <div class="panel">
            <h3>📐 Ориентация</h3>
            <div class="row"><span class="label">Pitch</span><span class="value" id="pitchVal">--°</span></div>
            <div class="bar"><div class="bar-fill" id="pitchBar" style="width:50%;background:var(--green)"></div></div>
            <div class="row"><span class="label">Roll</span><span class="value" id="rollVal">--°</span></div>
            <div class="bar"><div class="bar-fill" id="rollBar" style="width:50%;background:#44aaff"></div></div>
            <div class="row"><span class="label">Yaw</span><span class="value" id="yawVal">--°</span></div>
            <div class="bar"><div class="bar-fill" id="yawBar" style="width:50%;background:#ff44ff"></div></div>
        </div>

        <!-- Акселерометр -->
        <div class="panel">
            <h3>⚡ Акселерометр</h3>
            <div class="row"><span class="label">X</span><span class="value" id="accelX" style="color:#ff8844">--</span></div>
            <div class="bar"><div class="bar-fill" id="accelXBar" style="width:50%;background:#ff8844"></div></div>
            <div class="row"><span class="label">Y</span><span class="value" id="accelY" style="color:#44aaff">--</span></div>
            <div class="bar"><div class="bar-fill" id="accelYBar" style="width:50%;background:#44aaff"></div></div>
            <div class="row"><span class="label">Z</span><span class="value" id="accelZ" style="color:#ff44ff">--</span></div>
            <div class="bar"><div class="bar-fill" id="accelZBar" style="width:50%;background:#ff44ff"></div></div>
        </div>

        <!-- Визуализация -->
        <div class="panel">
            <h3>📱 Положение телефона</h3>
            <canvas id="visualizer"></canvas>
        </div>

        <!-- Логирование -->
        <div class="panel">
            <h3>📋 Запись данных <span style="font-size:11px;color:var(--muted);">(записей: <span id="logCount">0</span>)</span></h3>
            <div id="logPreview">Нажмите СТАРТ для записи</div>
            <div class="format-toggle">
                <button class="format-btn active" id="fmtCsv" onclick="setFormat('csv')">CSV</button>
                <button class="format-btn" id="fmtTxt" onclick="setFormat('txt')">TXT</button>
            </div>
            <div class="buttons">
                <button class="primary" id="btnStart" onclick="startLogging()">▶ СТАРТ</button>
                <button id="btnStop" onclick="stopLogging()" disabled>⏹ СТОП</button>
                <button onclick="exportLog()">📥 ЭКСПОРТ</button>
                <button onclick="clearLog()">🗑 ОЧИСТИТЬ</button>
            </div>
        </div>
    </div>

    <script>
        // Данные сенсоров
        let pitch = 0, roll = 0, yaw = 0;
        let ax = 0, ay = 0, az = 0;
        let light = null;
        let hasOrient = false, hasMotion = false, hasLight = false;
        let logging = false;
        let logEntries = [];
        let exportFormat = 'csv';

        // Orientation
        window.addEventListener('deviceorientation', e => {
            if (e.alpha != null) {
                pitch = e.beta || 0;
                roll = e.gamma || 0;
                yaw = e.alpha || 0;
                hasOrient = true;
                updateAll();
            }
        });

        // Motion
        window.addEventListener('devicemotion', e => {
            if (e.accelerationIncludingGravity) {
                ax = e.accelerationIncludingGravity.x || 0;
                ay = e.accelerationIncludingGravity.y || 0;
                az = e.accelerationIncludingGravity.z || 0;
                hasMotion = true;
                updateAll();
            }
        });

        // Ambient Light
        if ('AmbientLightSensor' in window) {
            try {
                const sensor = new AmbientLightSensor();
                sensor.onreading = () => {
                    light = sensor.illuminance;
                    hasLight = true;
                    updateAll();
                };
                sensor.onerror = () => { light = null; hasLight = false; updateAll(); };
                sensor.start();
            } catch(e) {
                light = null;
                hasLight = false;
            }
        }

        function updateAll() {
            updateDisplay();
            updateStatus();
            drawPhone();
            if (logging) addEntry();
        }

        function updateStatus() {
            document.getElementById('orientDot').className = 'dot ' + (hasOrient ? 'on' : 'off');
            document.getElementById('motionDot').className = 'dot ' + (hasMotion ? 'on' : 'off');
            document.getElementById('lightDot').className = 'dot ' + (hasLight ? 'on' : 'off');
            document.getElementById('lightVal').textContent = light != null ? light.toFixed(0) + ' lx' : '-- lx';
        }

        function updateDisplay() {
            document.getElementById('pitchVal').textContent = pitch.toFixed(1) + '°';
            document.getElementById('pitchBar').style.width = ((pitch + 90) / 180 * 100) + '%';
            document.getElementById('rollVal').textContent = roll.toFixed(1) + '°';
            document.getElementById('rollBar').style.width = ((roll + 90) / 180 * 100) + '%';
            document.getElementById('yawVal').textContent = yaw.toFixed(1) + '°';
            document.getElementById('yawBar').style.width = (yaw / 360 * 100) + '%';
            document.getElementById('accelX').textContent = ax.toFixed(2);
            document.getElementById('accelXBar').style.width = ((ax / 12 + 1) / 2 * 100) + '%';
            document.getElementById('accelY').textContent = ay.toFixed(2);
            document.getElementById('accelYBar').style.width = ((ay / 12 + 1) / 2 * 100) + '%';
            document.getElementById('accelZ').textContent = az.toFixed(2);
            document.getElementById('accelZBar').style.width = ((az / 12 + 1) / 2 * 100) + '%';
        }

        function drawPhone() {
            const c = document.getElementById('visualizer');
            const ctx = c.getContext('2d');
            c.width = c.offsetWidth;
            c.height = c.offsetHeight;
            const cx = c.width / 2, cy = c.height / 2;
            ctx.clearRect(0, 0, c.width, c.height);
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(roll * Math.PI / 180);
            ctx.scale(1, Math.cos(pitch * Math.PI / 180));
            ctx.fillStyle = '#1a1a2a';
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(-30, -50, 60, 100, 8);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        // Логирование
        function setFormat(f) {
            exportFormat = f;
            document.getElementById('fmtCsv').classList.toggle('active', f === 'csv');
            document.getElementById('fmtTxt').classList.toggle('active', f === 'txt');
        }

        function startLogging() {
            logging = true;
            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnStop').disabled = false;
        }

        function stopLogging() {
            logging = false;
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnStop').disabled = true;
        }

        function addEntry() {
            const entry = {
                timestamp: new Date().toISOString(),
                pitch, roll, yaw, ax, ay, az,
                light: light
            };
            logEntries.push(entry);
            document.getElementById('logCount').textContent = logEntries.length;
            if (logEntries.length % 5 === 0 || logEntries.length <= 5) {
                const prev = document.getElementById('logPreview');
                const last = logEntries.slice(-5);
                prev.innerHTML = last.map(e =>
                    `${e.timestamp.slice(11,19)} | P:${e.pitch.toFixed(1).padStart(5)} R:${e.roll.toFixed(1).padStart(5)} | Z:${e.az.toFixed(1).padStart(5)}${e.light!=null?' | '+e.light.toFixed(0)+'lx':''}`
                ).join('\n');
            }
        }

        function clearLog() {
            logEntries = [];
            document.getElementById('logCount').textContent = '0';
            document.getElementById('logPreview').innerHTML = 'Нажмите СТАРТ для записи';
        }

        function exportLog() {
            if (!logEntries.length) { alert('Нет данных'); return; }
            let content, fn, mime;
            if (exportFormat === 'csv') {
                const head = 'timestamp,pitch,roll,yaw,accelX,accelY,accelZ,light\n';
                content = head + logEntries.map(e =>
                    `${e.timestamp},${e.pitch},${e.roll},${e.yaw},${e.ax},${e.ay},${e.az},${e.light ?? ''}`
                ).join('\n');
                fn = 'sensor-data.csv'; mime = 'text/csv';
            } else {
                content = 'Sensor Lab Data\n' + '='.repeat(55) + '\n' +
                    'Timestamp                | Pitch   | Roll    | AccelZ  | Light\n' +
                    '-'.repeat(55) + '\n' +
                    logEntries.map(e =>
                        `${e.timestamp.slice(0,23).padEnd(24)} | ${e.pitch.toFixed(1).padStart(6)} | ${e.roll.toFixed(1).padStart(6)} | ${e.az.toFixed(1).padStart(6)} | ${e.light!=null ? e.light.toFixed(0)+' lx' : '--'}`
                    ).join('\n') + '\n' + '-'.repeat(55) + `\nВсего: ${logEntries.length}`;
                fn = 'sensor-data.txt'; mime = 'text/plain';
            }
            const b = new Blob([content], {type: mime});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(b);
            a.download = fn;
            a.click();
        }

        // iOS permission
        if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
            document.body.innerHTML = `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;z-index:999;">
                <div style="background:#12121a;padding:32px;border-radius:16px;text-align:center;border:1px solid #2a2a3a;">
                    <h2 style="color:#00ff88;margin-bottom:16px;">Sensor Lab</h2>
                    <p style="color:#aaa;margin-bottom:24px;">Нужен доступ к датчикам движения</p>
                    <button onclick="DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')location.reload()})" style="background:#00ff88;color:#000;border:none;padding:16px 32px;border-radius:8px;font-size:16px;cursor:pointer;">РАЗРЕШИТЬ</button>
                </div>
            </div>`;
        }
    </script>
</body>
</html>
